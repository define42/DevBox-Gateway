name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - page/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - page/**
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: page/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement page/requirements.txt

      - name: Build documentation with strict validation
        run: python -m mkdocs build --strict --config-file page/mkdocs.yml

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: page/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement page/requirements.txt

      - name: Deploy to GitHub Pages
        run: python -m mkdocs gh-deploy --strict --force --config-file page/mkdocs.yml
