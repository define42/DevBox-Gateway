name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: devbox-gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.existing.outputs.version == '' && steps.tag.outputs.changelog || '' }}
      recovered: ${{ steps.existing.outputs.version != '' }}

    permissions:
      contents: write   # required for tags + GitHub releases
      packages: write   # required for GHCR push

    steps:
      # -------------------------------
      # Checkout
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # REQUIRED for tag calculation

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev   qemu-kvm  libvirt-daemon-system  libvirt-clients
          sudo bash -c 'cat >>/etc/libvirt/qemu.conf <<EOF
          user = "root"
          group = "root"
          dynamic_ownership = 0
          security_driver = "none"
          security_default_confined = 0
          EOF'
          sudo systemctl enable --now libvirtd
          sudo systemctl start libvirtd
          sudo chmod 777 /var/run/libvirt/libvirt-sock
          sudo chmod 777 /var/lib/libvirt/images/
          sudo virsh -c qemu:///system pool-info default || \
            sudo virsh -c qemu:///system pool-define-as default dir --target /var/lib/libvirt/images
          sudo virsh -c qemu:///system pool-start default
          sudo virsh -c qemu:///system pool-autostart default
          sudo systemctl restart libvirtd || true
          sudo systemctl restart virtqemud || true
          sudo systemctl restart virtstoraged || true

      # -------------------------------
      # Go setup
      # -------------------------------
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # -------------------------------
      # Build & test
      # -------------------------------
      - name: Lint
        run: make lint

      - name: Security scan (gosec)
        run: make gosec

      - name: Run tests with coverage
        run: |
          export LIBVIRT_VOLUME_MODE=0666
          export LIBVIRT_VOLUME_OWNER=$(id -u libvirt-qemu 2>/dev/null || echo 0)
          export LIBVIRT_VOLUME_GROUP=$(id -g libvirt-qemu 2>/dev/null || echo 0)
          sudo mkdir /data/
          sudo chmod 777 /data/
          sudo chmod 777 /var/lib/libvirt/images/
          make test

      - name: Show coverage in job summary
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          echo "## Go Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          fail_ci_if_error: true

      - name: Vet
        run: go vet ./...

      # Native packages compile and validate against their distribution
      # baselines inside Docker, independently of the runner's libvirt ABI.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check native package compatibility
        if: github.event_name == 'pull_request'
        run: make deb rpm VERSION=0.0.0

      # -------------------------------
      # Versioning & Release (main only)
      # -------------------------------
      - name: Recover release version when rerunning a tagged commit
        if: github.event_name == 'push'
        id: existing
        shell: bash
        run: |
          # A failed image build must be retryable without allocating a new version.
          mapfile -t tags < <(git tag --points-at "$GITHUB_SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if (( ${#tags[@]} > 1 )); then
            echo "More than one gateway release tag points at this commit." >&2
            exit 1
          fi
          if (( ${#tags[@]} == 1 )); then
            printf 'version=%s\n' "${tags[0]#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and create tag
        if: github.event_name == 'push'
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          custom_tag: ${{ steps.existing.outputs.version }}

      - name: Stamp version into HTML titles
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        run: sed -i "s/DEVBOX_GATEWAY_VERSION/${{ steps.tag.outputs.new_version }}/g" internal/gateway/html.go internal/webassets/dashboard.html

      # -------------------------------
      # RPM package (main only, when a new tag is cut). The RPM version uses the
      # same numeric version the container release is tagged with (new_version is
      # new_tag without the leading "v", as RPM versioning requires).
      # -------------------------------
      - name: Build RPM package
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        run: make rpm VERSION=${{ steps.tag.outputs.new_version }}

      - name: Build deb package
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        run: make deb VERSION=${{ steps.tag.outputs.new_version }}

      # -------------------------------
      # SauronAgent packages (main only, when a new tag is cut). Same version and
      # release as the gateway packages above; the version is also stamped into
      # both SauronAgent binaries.
      # -------------------------------
      - name: Build SauronAgent RPM package
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        run: make sauron-rpm VERSION=${{ steps.tag.outputs.new_version }}

      - name: Build SauronAgent deb package
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        run: make sauron-deb VERSION=${{ steps.tag.outputs.new_version }}

      - name: Upload gateway and SauronAgent packages
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: gateway-packages-${{ steps.tag.outputs.new_tag }}
          path: |
            dist/*.rpm
            dist/*.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      # -------------------------------
      # Container build & push (GHCR)
      # -------------------------------
      - name: Login to GHCR
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devbox-gateway:latest
            ghcr.io/${{ github.repository_owner }}/devbox-gateway:${{ steps.tag.outputs.new_tag }}
            ghcr.io/${{ github.repository_owner }}/devbox-gateway:${{ github.sha }}

  ubuntu-image:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ubuntu26.04-xfce.yml
    with:
      version: ${{ needs.build.outputs.version }}

  rocky-image:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/rocky9-xfce.yml
    with:
      version: ${{ needs.build.outputs.version }}

  release:
    needs: [build, ubuntu-image, rocky-image]
    if: github.event_name == 'push' && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download gateway and SauronAgent packages
        uses: actions/download-artifact@v8
        with:
          name: gateway-packages-${{ needs.build.outputs.tag }}
          path: release/packages

      - name: Download Ubuntu image assets
        uses: actions/download-artifact@v8
        with:
          name: ubuntu26.04-xfce-v${{ needs.build.outputs.version }}
          path: release/images

      - name: Download Rocky Linux 9 image assets
        uses: actions/download-artifact@v8
        with:
          name: rocky9-xfce-v${{ needs.build.outputs.version }}
          path: release/images

      - name: Assemble the shared GitHub release
        id: release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build.outputs.tag }}
          commit: ${{ github.sha }}
          name: Release ${{ needs.build.outputs.tag }}
          # Keep uploads in a draft so retrying a partial upload is safe.
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
          # Rebuilds may have fewer image parts; discard stale draft assets.
          removeArtifacts: true
          # Tag-action has no new commits on a retry of the same tag. Generate
          # notes for a new draft, or preserve an interrupted draft's old body.
          generateReleaseNotes: ${{ needs.build.outputs.recovered == 'true' }}
          omitBodyDuringUpdate: true
          artifactErrorsFailBuild: true
          artifacts: release/packages/*.rpm,release/packages/*.deb,release/images/*.img.part-*,release/images/*.img.sha256,release/images/*.img.manifest.json
          body: |
            ${{ needs.build.outputs.changelog }}

            ### Ubuntu 26.04 XFCE image

            The image and its embedded SauronAgent use version ${{ needs.build.outputs.version }}.
            Download all image parts and the checksum file into one directory, then reconstruct and verify:

            ```sh
            cat ubuntu26.04-xfce-${{ needs.build.outputs.tag }}.img.part-* > ubuntu26.04-xfce-${{ needs.build.outputs.tag }}.img
            sha256sum --check ubuntu26.04-xfce-${{ needs.build.outputs.tag }}.img.sha256
            ```

            ### Rocky Linux 9 XFCE image

            The image and its embedded SauronAgent use version ${{ needs.build.outputs.version }}.
            Download all image parts and the checksum file into one directory, then reconstruct and verify:

            ```sh
            cat rocky9-xfce-${{ needs.build.outputs.tag }}.img.part-* > rocky9-xfce-${{ needs.build.outputs.tag }}.img
            sha256sum --check rocky9-xfce-${{ needs.build.outputs.tag }}.img.sha256
            ```

            Each `.img.manifest.json` asset records its source image and build provenance.

      - name: Publish the complete release
        # A previously published release is skipped by the assembly action.
        if: steps.release.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
