services:
  gateway:
    build:
      context: ./
      # Build with host networking so `go mod download`/`go build` can reach the
      # module proxy. The default BuildKit network has no working outbound route
      # in this environment (IPv6-only resolution fails), breaking the build.
      network: host
    restart: always
    # A stable hostname becomes the Splunk "host" of forwarded audit events;
    # without it every recreated container reports a new container ID.
    hostname: devbox-gateway
    # Libvirt creates the dedicated VM bridge during gateway startup. Sharing
    # the host network lets the gateway reach it without a pre-existing macvlan.
    network_mode: host
    # The SauronAgent collector (SAURON_ENABLE below) listens on AF_VSOCK,
    # which Docker's default seccomp profile blocks. The container already
    # drives the host's libvirt through its socket, so the syscall filter adds
    # little on top of that; drop this line together with SAURON_ENABLE to keep
    # it. vsock is shared with containers while the host's
    # net.vsock.child_ns_mode is "global", the default.
    security_opt:
      - seccomp=unconfined
    environment:
      # Pin the data root to the bind-mounted /data; the binary's built-in
      # default is /var/lib/libvirt/devbox-gateway for native (RPM) installs.
      - DATA_ROOT_DIR=/data
      - BASE_IMAGE_DIR=/data/baseimages
      # Keep the JSON Lines audit stream on the host-mounted /data volume so a
      # Splunk agent can tail it outside the container.
      - AUDIT_LOG_FILE=/data/logs/audit.jsonl
      # Also forward every audit event to the bundled Splunk over HEC. The
      # token must match the splunk service's SPLUNK_HEC_TOKEN.
      - SPLUNK_HEC_ENDPOINT=https://127.0.0.1:8088
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:-11111111-2222-3333-4444-555555555555}
      - SPLUNK_HEC_INDEX=devbox_audit
      # The bundled Splunk serves HEC with its default self-signed certificate.
      - SPLUNK_HEC_SKIP_TLS_VERIFY=true
      # Collect SauronAgent events from inside the VMs (over vsock) and forward
      # them to the bundled Splunk, into their own index.
      - SAURON_ENABLE=true
      - SAURON_EVENT_LOG_FILE=/data/logs/sauron.jsonl
      - SAURON_SPLUNK_HEC_ENDPOINT=https://127.0.0.1:8088
      - SAURON_SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:-11111111-2222-3333-4444-555555555555}
      - SAURON_SPLUNK_HEC_INDEX=devbox_sauron
      - SAURON_SPLUNK_HEC_SKIP_TLS_VERIFY=true
      - LDAP_SKIP_TLS_VERIFY=true
      - LDAP_URL=ldaps://127.0.0.1:389
      - VDI_AUTO_SHUTDOWN_HOURS=2
      - LDAP_REQUIRED_GROUPS=team10_r
      - ADMIN_GROUP=devbox-admins
    volumes:
      - /var/run/libvirt:/var/run/libvirt
      - /data/:/data/

  ldap:
    image: glauth/glauth
    container_name: ldap
    restart: always
    ports:
      - "127.0.0.1:389:389"
    volumes:
      - ./testldap/default-config.cfg:/app/config/config.cfg
      - ./testldap/key.pem:/app/config/key.pem
      - ./testldap/cert.pem:/app/config/cert.pem
    networks:
      app-net:

  # Local Splunk Enterprise receiving the gateway's audit events over HEC
  # (https://127.0.0.1:8088 on the host). Splunk Web: http://localhost:8000,
  # user admin, password SPLUNK_PASSWORD. The first start takes a few minutes;
  # the gateway queues and retries audit events until HEC is up.
  splunk:
    image: splunk/splunk:10.4
    container_name: splunk
    restart: always
    # splunkd needs longer than compose's default 10s to shut down cleanly;
    # without this `docker compose stop` (run first by `make run`) kills it.
    stop_grace_period: 2m
    environment:
      # Starting this container accepts the Splunk General Terms:
      # https://www.splunk.com/en_us/legal/splunk-general-terms.html
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      # Development-only credentials; override both via the environment or .env.
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-devbox-splunk}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:-11111111-2222-3333-4444-555555555555}
      # Creates the devbox_audit and devbox_sauron indexes once Splunk is up.
      - SPLUNK_ANSIBLE_POST_TASKS=file:///tmp/defaults/create_index.yml
    ports:
      - "8000:8000"      # Splunk Web
      - "127.0.0.1:8088:8088" # HEC for the gateway in the host network
    volumes:
      - ./testsplunk/create_index.yml:/tmp/defaults/create_index.yml:ro
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
    networks:
      app-net:

volumes:
  splunk-etc:
  splunk-var:

networks:
  app-net:
    driver: bridge
