# Directories for SauronAgent and SauronHost.
#
# Install as /usr/lib/tmpfiles.d/sauronagent.conf and apply with
#   systemd-tmpfiles --create
#
# The service units also create their own directories (StateDirectory= in the
# agent, LogsDirectory= in the collector). These entries exist so the layout is
# correct immediately after the package is installed -- before the first
# start, and for an operator who runs the binary by hand -- and so that a mode
# loosened by accident is put back on the next systemd-tmpfiles run. The modes
# here match the units deliberately; change both together.
#
# THE AGE COLUMN IS "-" ON EVERY LINE AND MUST STAY THAT WAY. An age would let
# systemd-tmpfiles --clean delete spooled audit records that have not been
# acknowledged by the host yet, which is evidence destroyed by the operating
# system's own housekeeping.

#Type Path                       Mode UID         GID         Age Argument

# Agent state. 0700 because the spool holds the command lines, arguments and
# file paths of every audited process on the guest -- routinely including
# things that were typed on a command line and should never have been, such as
# a password passed as an argument. No other account on the guest, service or
# human, has a reason to read it, and group access would only widen that.
d /var/lib/sauronagent       0700 sauronagent sauronagent -
d /var/lib/sauronagent/spool 0700 sauronagent sauronagent -

# Agent configuration. Readable by the service, not by the rest of the guest.
d /etc/sauronagent           0750 root        sauronagent -

# Collector output on the hypervisor. 0750 rather than 0700 so that a log
# shipper (rsyslog, a SIEM forwarder) can be added to the sauronhost group and
# read the events without being able to rewrite them. The file the collector
# writes inherits its umask (0027), so it is group-readable and not
# group-writable.
d /var/log/sauronhost        0750 sauronhost  sauronhost  -
d /etc/sauronhost            0750 root        sauronhost  -
