# System users for SauronAgent and SauronHost.
#
# Install as /usr/lib/sysusers.d/sauronagent.conf and apply with
#   systemd-sysusers
#
# Both components run as system users. The agent is given audit read/control
# capabilities (granted by the unit, not by the account) and the collector
# is given none, so neither account needs a login, a password, a usable shell
# or membership of any other group.
#
# The two entries are listed together for convenience, but they belong on
# different machines: sauronagent inside each guest, sauronhost on the
# hypervisor. A packager splitting this into two packages should split this
# file with it -- there is no reason for a guest to know about sauronhost.
#
# The UIDs are left to systemd (the "-" in the ID column) so that each host
# allocates from its own system range. Nothing in SauronAgent compares UIDs
# across machines: a VM is identified by its VSOCK CID, never by a uid.

#Type Name        ID Description                                  Home directory       Shell
u     sauronagent -  "SauronAgent guest audit agent"              /var/lib/sauronagent /usr/sbin/nologin
u     sauronhost  -  "SauronHost hypervisor audit collector"      /var/log/sauronhost  /usr/sbin/nologin
