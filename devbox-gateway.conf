# devbox-gateway configuration file.
#
# The gateway reads this file on startup (default
# /etc/devbox-gateway/devbox-gateway.conf, override with the CONFIG_FILE
# environment variable). Each line is KEY=VALUE; '#' starts a comment.
#
# Every setting below is optional; the value shown is the built-in default. A
# matching environment variable, if set, takes precedence over the file value.
# Uncomment and edit the lines you want to change, then restart the service:
#   systemctl restart devbox-gateway
#
# See https://github.com/define42/devbox-gateway for full documentation.

# --- Listener / TLS (front side, facing clients) ---
#LISTEN_ADDR=:443
# Public RDP connection port. Empty follows LISTEN_ADDR (443 for an ephemeral
# listener). Set this when a proxy or port mapping exposes a different port.
#RDP_PORT=
# Optional Go runtime profiler on a separate listener. Empty disables it. When
# enabled, the host must be a literal loopback IP such as 127.0.0.1 or ::1;
# wildcard, hostname, and non-loopback addresses are rejected at startup. The
# profiler is never mounted on LISTEN_ADDR.
#PPROF_LISTEN_ADDR=
#CERT_FILE=
#KEY_FILE=
#FRONT_DOMAIN=desktop.local.gd
# Setup timeouts and HTTP writes. Streaming responses renew this write deadline
# for each chunk; HTTP writes use 10s when TIMEOUT is non-positive.
#TIMEOUT=10s

# --- ACME / Let's Encrypt (automatic public certificates) ---
#ACME_ENABLE=false
#ACME_EMAIL=
#ACME_CA=

# --- Audit logging (JSON Lines; one complete JSON event per line) ---
# The service unit creates /var/log/devbox-gateway automatically. Point a
# Splunk file monitor at this path, or override it with another writable path.
#AUDIT_LOG_FILE=/var/log/devbox-gateway/audit.jsonl
#
# Optionally also forward every audit event to a Splunk HTTP Event Collector.
# Setting the endpoint enables forwarding and then requires the token; an empty
# index uses the token's default index. The audit file above is still written.
#SPLUNK_HEC_ENDPOINT=https://splunk.example.com:8088
#SPLUNK_HEC_TOKEN=
#SPLUNK_HEC_INDEX=
#SPLUNK_HEC_SKIP_TLS_VERIFY=false

# --- SauronAgent guest audit events ---
# Collect the Linux audit events SauronAgent streams from inside the VMs. When
# enabled, every newly created VM gets a virtio-vsock device and the gateway
# listens on AF_VSOCK (host CID 2) for the agents. Each connection is attributed
# to the VM libvirt assigned its CID to, never to what the guest claims, and
# every event carries the VM name, UUID and owner. VMs created while this was
# off have no vsock device; recreate them to collect their events. Do not also
# run sauronhost on this host: it would compete for the same vsock port.
#SAURON_ENABLE=false
#SAURON_VSOCK_PORT=9000
# Every event is appended here (rotated at 256 MiB, 8 files kept). Empty
# disables the file, which then requires the Splunk HEC endpoint below.
#SAURON_EVENT_LOG_FILE=/var/log/devbox-gateway/sauron.jsonl
#
# Optionally also forward every guest event to a Splunk HTTP Event Collector,
# separately from the audit forwarding above. Setting the endpoint requires the
# token; an empty index uses the token's default index.
#SAURON_SPLUNK_HEC_ENDPOINT=https://splunk.example.com:8088
#SAURON_SPLUNK_HEC_TOKEN=
#SAURON_SPLUNK_HEC_INDEX=
#SAURON_SPLUNK_HEC_SKIP_TLS_VERIFY=false
# Guest events are acknowledged once they are stored in this spool, and are
# delivered from it whenever Splunk is reachable, surviving gateway restarts
# and outages of days. Size it for the longest outage to ride out; when it is
# full, new events wait in the guests' own spools instead. Empty dir ->
# <DATA_ROOT_DIR>/sauron-spool.
#SAURON_SPOOL_DIR=
#SAURON_SPOOL_MAX_MIB=10240

# --- Storage / libvirt ---
#DATA_ROOT_DIR=/var/lib/libvirt/devbox-gateway
#VIRT_STORAGE_POOL_NAME=desktop
# Directory of selectable base VDI images (.img/.qcow2/.raw); must contain at
# least one image at boot. Empty -> <DATA_ROOT_DIR>/baseimages
#BASE_IMAGE_DIR=
# Maximum number of VDIs (VMs) each user may own at once; creating another VM
# is refused once the user owns this many. Values <=0 disable the limit.
#MAX_VDI_PER_USER=10
# Shut down a running VDI after this many hours without use. A VDI counts as
# used when it is created or started and whenever its owner opens RDP, serial,
# or noVNC. Open gateway connections prevent auto-shutdown, even without input;
# the full idle window starts when the last connection ends. The guest is first
# asked to power off (ACPI) and is force-stopped if still running a few minutes
# later. Values <=0 disable auto-shutdown.
#VDI_AUTO_SHUTDOWN_HOURS=0

# --- VM resources (operator-defined only, users cannot choose or change) ---
# Number of virtual CPUs assigned to every VM. Values <=0 fall back to the
# default.
#VM_VCPU_COUNT=4
# Memory in MiB assigned to every VM. Values <=0 fall back to the default.
#VM_MEMORY_MIB=4096

# --- LDAP authentication ---
# LDAP_URL is required; the gateway refuses to start when it is empty.
#LDAP_URL=ldaps://ldap:389
# Total LDAP authentication timeout, including dial, TLS, bind, and search.
# Values <=0 fall back to the default; request cancellation also aborts the attempt.
#LDAP_AUTH_TIMEOUT=10s
#LDAP_BASE_DN=dc=glauth,dc=com
#LDAP_USER_FILTER=(mail=%s)
#LDAP_USER_DOMAIN=@example.com
#LDAP_STARTTLS=false
#LDAP_SKIP_TLS_VERIFY=false
# Optional single LDAP group whose direct members receive administrator access
# at login. Accepts a bare group name or full DN. Empty disables the role.
#ADMIN_GROUP=
#LOGIN_RATE_LIMIT_MAX_ATTEMPTS=5
#LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS=50
#LOGIN_RATE_LIMIT_WINDOW=5m
#LOGIN_RATE_LIMIT_LOCKOUT=15m

# --- SNI routing secret (auto-generated and persisted when empty) ---
#SNI_HASH_SECRET=

# --- Debugging ---
# Verbose, per-connection logging. When true the gateway logs every accepted
# front connection (HTTPS vs RDP, with source address) and every HTTP/WebSocket
# request (type, source address, method, path). Useful for tracing
# connectivity. Noisy; leave off in normal operation.
#DEBUG_CONNECTIONS=false
