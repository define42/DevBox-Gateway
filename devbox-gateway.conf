# devbox-gateway configuration file.
#
# The gateway reads this file on startup (default
# /etc/devbox-gateway/devbox-gateway.conf, override with the CONFIG_FILE
# environment variable). Each line is KEY=VALUE; '#' starts a comment.
#
# Every setting below is optional; the value shown is the built-in default. A
# matching environment variable, if set, takes precedence over the file value.
# Uncomment and edit the lines you want to change, then restart the service:
#   systemctl restart devbox-gateway
#
# See https://github.com/define42/devbox-gateway for full documentation.

# --- Listener / TLS (front side, facing clients) ---
#LISTEN_ADDR=:443
# Optional Go runtime profiler on a separate listener. Empty disables it. When
# enabled, the host must be a literal loopback IP such as 127.0.0.1 or ::1;
# wildcard, hostname, and non-loopback addresses are rejected at startup. The
# profiler is never mounted on LISTEN_ADDR.
#PPROF_LISTEN_ADDR=
#CERT_FILE=
#KEY_FILE=
#FRONT_DOMAIN=desktop.local.gd
#TIMEOUT=10s

# --- ACME / Let's Encrypt (automatic public certificates) ---
#ACME_ENABLE=false
#ACME_EMAIL=
#ACME_CA=

# --- Audit logging (JSON Lines; one complete JSON event per line) ---
# The service unit creates /var/log/devbox-gateway automatically. Point a
# Splunk file monitor at this path, or override it with another writable path.
#AUDIT_LOG_FILE=/var/log/devbox-gateway/audit.jsonl

# --- Storage / libvirt ---
#DATA_ROOT_DIR=/var/lib/libvirt/devbox-gateway
#VIRT_STORAGE_POOL_NAME=desktop
# Directory of selectable base VDI images (.img/.qcow2/.raw); must contain at
# least one image at boot. Empty -> <DATA_ROOT_DIR>/baseimages
#BASE_IMAGE_DIR=
# Maximum number of VDIs (VMs) each user may own at once; creating another VM
# is refused once the user owns this many. Values <=0 disable the limit.
#MAX_VDI_PER_USER=10
# Shut down a running VDI after this many hours without use. A VDI counts as
# used when it is created or started and whenever its owner opens RDP, serial,
# or noVNC from the dashboard. The guest is first asked to power off (ACPI
# power button) and is force-stopped if it is still running a few minutes
# later. Values <=0 disable auto-shutdown.
#VDI_AUTO_SHUTDOWN_HOURS=0

# --- VM resources (operator-defined only, users cannot choose or change) ---
# Number of virtual CPUs assigned to every VM. Values <=0 fall back to the
# default.
#VM_VCPU_COUNT=4
# Memory in MiB assigned to every VM. Values <=0 fall back to the default.
#VM_MEMORY_MIB=4096

# --- LDAP authentication ---
# LDAP_URL is required; the gateway refuses to start when it is empty.
#LDAP_URL=ldaps://ldap:389
#LDAP_BASE_DN=dc=glauth,dc=com
#LDAP_USER_FILTER=(mail=%s)
#LDAP_USER_DOMAIN=@example.com
#LDAP_STARTTLS=false
#LDAP_SKIP_TLS_VERIFY=false
# Optional single LDAP group whose direct members receive administrator access
# at login. Accepts a bare group name or full DN. Empty disables the role.
#ADMIN_GROUP=
#LOGIN_RATE_LIMIT_MAX_ATTEMPTS=5
#LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS=50
#LOGIN_RATE_LIMIT_WINDOW=5m
#LOGIN_RATE_LIMIT_LOCKOUT=15m

# --- SNI routing secret (auto-generated and persisted when empty) ---
#SNI_HASH_SECRET=

# --- Debugging ---
# Verbose, per-connection logging. When true the gateway logs every accepted
# front connection (HTTPS vs RDP, with source address) and every HTTP/WebSocket
# request (type, source address, method, path). Useful for tracing
# connectivity. Noisy; leave off in normal operation.
#DEBUG_CONNECTIONS=false
